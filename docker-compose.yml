services:
  frontend:
    build:
      context: ./front
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./back
    environment:
      DATABASE_URL: postgresql://bill_user:bill_password@db:5432/bill_split
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bill_split
      POSTGRES_USER: bill_user
      POSTGRES_PASSWORD: bill_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bill_user -d bill_split"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
